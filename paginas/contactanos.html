<div class="card">
<h4>Envíanos un mensaje</h4>
<form id="form-contacto" novalidate>
<div class="campo"><label for="nombres">Nombres</label><input type="text" name="nombres" id="nombres" autocomplete="name"><small class="error"></small></div>
<div class="campo"><label for="rsocial">Empresa (opcional)</label><input type="text" name="rsocial" id="rsocial" autocomplete="organization"><small class="error"></small></div>
<div class="campo"><label for="telefono">Teléfono</label><input type="tel" name="telefono" id="telefono" autocomplete="tel"><small class="error"></small></div>
<div class="campo"><label for="email">Email</label><input type="email" name="email" id="email" autocomplete="email"><small class="error"></small></div>
<div class="campo"><label for="mensaje">Mensaje</label><textarea name="mensaje" id="mensaje" rows="6"></textarea><small class="error"></small></div>
<input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none">
<div class="campo"><label class="check"><input type="checkbox" id="acepto"><span>Acepto la <a href="#privacidad">política de privacidad</a></span></label><small class="error"></small></div>
<button class="btn" type="submit">Enviar mensaje</button>
<p class="estado" role="status" aria-live="polite"></p>
</form>
<div class="exito" hidden>
<i class="fas fa-circle-check"></i>
<h4>¡Mensaje enviado!</h4>
<p>Gracias por escribirnos. Te responderemos lo antes posible.</p>
<button class="btn" type="button" id="otro">Enviar otro mensaje</button>
</div>
